name: Validate preserved configuration reads

on:
  push:
    branches: [validation/config-read-errors-20261119]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 7bb9931bb5e503bc31a13013075e4dc5bded40ab
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install pandas
      - name: Prove read failures lose settings before the fix
        shell: bash
        run: |
          git show 9f8b1ae2f39783d35ca5b729c2ea5ee6cb5113be:hooks/ponytail-config.js > hooks/ponytail-config.js
          set +e
          node --test --test-reporter=tap tests/config-atomic-write.test.js > /tmp/config-read-baseline.tap 2>&1
          result=$?
          set -e
          cat /tmp/config-read-baseline.tap
          git checkout -- hooks/ponytail-config.js
          test "$result" -eq 1
          node -e 'const s=require("node:fs").readFileSync("/tmp/config-read-baseline.tap","utf8"); if(!/^# fail 4$/m.test(s) || !/^# pass 5$/m.test(s) || !/^# skipped 0$/m.test(s)) throw new Error("unexpected baseline result");'
      - run: node --test tests/config-atomic-write.test.js
      - run: node scripts/check-rule-copies.js
      - run: node scripts/check-versions.js
      - run: npm test
      - run: python3 benchmarks/agentic/run.py --selftest
      - run: git diff --exit-code
